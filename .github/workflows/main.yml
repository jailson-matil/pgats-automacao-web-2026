
name: Web E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:

      # Clonar o projeto
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Conferir versão
      - name: Node version
        run: node --version

      # Instalar dependências
      - name: Install dependencies
        run: npm ci

      # Executar testes Cypress em modo headless
      - name: Run Cypress E2E Tests
        run: npx cypress run --headless --browser chrome

      # Armazenar relatórios e evidências
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
